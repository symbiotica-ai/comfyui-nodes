name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the superseded run for that ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and ComfyUI's current well-supported runtime.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite needs pillow (compose/markers), requests (the grok/wavespeed
      # API clients), and torch — which those clients pull transitively via
      # utils.imageurl2tensor. torch is a ComfyUI-provided runtime dep the repo
      # never declares, so a clean checkout needs the CPU wheel explicitly.
      # faster-whisper stays out (heavy, imported lazily).
      - name: Install test dependencies
        run: |
          python -m pip install pytest pillow requests
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Must be `pytest tests/`, never `python -m pytest`: the top-level py/
      # directory shadows pytest's own `py` module and crashes collection.
      - name: Run Python tests
        run: pytest tests/

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS. Node 25's `--test <dir>` form is not used here anyway,
          # but the LTS is the right target to test against.
          node-version: 24
      # Syntax-check every shipped frontend module, including ones no test
      # imports yet — a broken web/js file otherwise fails silently in the UI.
      - name: Syntax-check web/js
        run: find web/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      # Keep the quoted glob: the directory form (--test tests/js/) fails on
      # newer Node.
      - name: Run JavaScript tests
        run: node --import ./tests/js/register_hooks.mjs --test 'tests/js/*.test.mjs'

  # One stable required check for branch protection, so CI jobs can be added,
  # split, or renamed without editing the protection rule.
  required:
    name: required
    if: ${{ always() }}
    needs: [python, javascript]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
    steps:
      - name: All test jobs passed
        run: |
          [ "$PYTHON_RESULT" = "success" ] || { echo "python job: $PYTHON_RESULT"; exit 1; }
          [ "$JAVASCRIPT_RESULT" = "success" ] || { echo "javascript job: $JAVASCRIPT_RESULT"; exit 1; }
