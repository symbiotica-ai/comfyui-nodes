[project]
name = "symbiotica"
description = "All-in-one creative pack for ComfyUI: agent-based LLMs (Claude, Gemini, GPT, Grok), Wavespeed image and video generation (Flux, Nano Banana, Qwen, Sora 2, Veo 3, Wan 2.5, SeedDream, InfiniteTalk), audio and transcription (Whisper, ElevenLabs, Submagic), Remotion-rendered overlays and captions, and video composition utilities."
version = "2026.8.22"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Razvan Matei" },
]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "agents",
    "llm",
    "claude",
    "gemini",
    "gpt",
    "grok",
    "wavespeed",
    "flux",
    "nano-banana",
    "qwen",
    "sora",
    "veo",
    "wan",
    "seedream",
    "infinitetalk",
    "whisper",
    "elevenlabs",
    "remotion",
    "captions",
    "video",
    "audio",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "faster-whisper",
]

[project.urls]
Repository = "https://github.com/symbiotica-ai/comfyui-nodes"
"Bug Tracker" = "https://github.com/symbiotica-ai/comfyui-nodes/issues"

[tool.comfy]
PublisherId = "razvan-symbiotica"
DisplayName = "Symbiotica"
