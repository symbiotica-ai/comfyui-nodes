[project]
name = "symbiotica"
description = "Creative pack for ComfyUI: Claude and Gemini image/text nodes routed through Cloudflare AI Gateway, the order pipeline (Asset Focus, Prompt Block, Order Tracker, Studio Library, Recipes), audio and transcription (Whisper, ElevenLabs, Submagic), Remotion-rendered overlays and captions, and video composition utilities."
version = "2026.9.22"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Razvan Matei" },
]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "llm",
    "claude",
    "gemini",
    "grok",
    "whisper",
    "elevenlabs",
    "remotion",
    "captions",
    "video",
    "audio",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "faster-whisper",
]

[project.urls]
Repository = "https://github.com/symbiotica-ai/comfyui-nodes"
"Bug Tracker" = "https://github.com/symbiotica-ai/comfyui-nodes/issues"

[tool.comfy]
PublisherId = "razvan-symbiotica"
DisplayName = "Symbiotica"
