[project]
name = "symbiotica"
description = "Creative pack for ComfyUI: Claude and Gemini image/text nodes routed through Cloudflare AI Gateway, and the order pipeline (Asset Focus, Prompt Block, Order Tracker, Studio Library, Recipes, Control Image, Modules)."
version = "2026.9.23"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Razvan Matei" },
]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "llm",
    "claude",
    "gemini",
    "pipeline",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[project.urls]
Repository = "https://github.com/symbiotica-ai/comfyui-nodes"
"Bug Tracker" = "https://github.com/symbiotica-ai/comfyui-nodes/issues"

[tool.comfy]
PublisherId = "razvan-symbiotica"
DisplayName = "Symbiotica"
